<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Familiares PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e293b; --success: #059669; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; }
        .app-card { max-width: 420px; margin: auto; background: white; border-radius: 28px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .header { background: var(--primary); color: white; padding: 25px; text-align: center; }
        .form { padding: 25px; }
        label { display: block; margin-top: 18px; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 1.5px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 1rem; outline: none; }
        .btn-save { width: 100%; background: var(--success); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 1.1rem; font-weight: 600; margin-top: 30px; cursor: pointer; }
        #status { margin-top: 15px; text-align: center; font-size: 0.95rem; font-weight: 600; }
        .new-cat-input { display: none; margin-top: 10px; background-color: #f0f9ff; border-color: #7dd3fc; }
    </style>
</head>
<body onload="cargarCategorias()">

<div class="app-card">
    <div class="header">
        <h2 style="margin:0; font-size: 1.5rem;">💸 Gastos Familia</h2>
        <p style="margin:5px 0 0 0; opacity: 0.7; font-size: 0.85rem;">Martín, Flor, Pili, Tomy, Bauti</p>
    </div>

    <div class="form">
        <label>📅 Fecha</label>
        <input type="date" id="date">

        <label>👤 ¿Quién gasta?</label>
        <select id="user">
            <option value="Martín">Martín</option>
            <option value="Flor">Flor</option>
            <option value="Pili">Pili</option>
            <option value="Tomy">Tomy</option>
            <option value="Bauti">Bauti</option>
        </select>
        
        <label>💰 Monto ($)</label>
        <input type="number" id="amount" placeholder="0.00" inputmode="decimal">

        <label>📂 Categoría</label>
        <select id="category" onchange="toggleNuevaCat(this.value)">
            <option value="">Cargando lista...</option>
        </select>
        <input type="text" id="customCategory" class="new-cat-input" placeholder="Nombre de la nueva categoría">

        <label>📝 Detalle</label>
        <input type="text" id="desc" placeholder="Ej: Compra en Farmacity">

        <label>💳 Tarjeta / Medio</label>
        <select id="card">
            <option value="Visa">💳 Visa</option>
            <option value="Mastercard">🔴 Mastercard</option>
            <option value="Amex">🟩 American Express</option>
            <option value="Debito">🏦 Tarjeta de Débito</option>
            <option value="Transferencia">↔️ Transferencia</option>
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Dinero en Cuenta">💲 Dinero en cuenta</option>
        </select>

        <label>🏦 Banco / Plataforma</label>
        <select id="bank">
            <option value="Galicia">🟠 Galicia</option>
            <option value="BBVA">🟦 BBVA</option>
            <option value="ICBC">🟥 ICBC</option>
            <option value="BNA">🏛️ Banco Nación</option>
            <option value="Mercado Pago">🔵 Mercado Pago</option>
            <option value="Efectivo">💵 Efectivo</option>
        </select>

        <button class="btn-save" id="btn" onclick="saveData()">Guardar Gasto</button>
        <div id="status"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydjYL0AjyQuPBW3fyYcAJduB20amWvY_OhYNJKa8SzdCJK53RV--lhAuTJ9BzF7F0P4w/exec";

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    async function cargarCategorias() {
        const select = document.getElementById('category');
        try {
            const response = await fetch(SCRIPT_URL + "?action=getCategories");
            const categorias = await response.json();
            select.innerHTML = '';
            categorias.forEach(cat => {
                let opt = document.createElement('option');
                opt.value = opt.innerHTML = cat;
                select.appendChild(opt);
            });
            let optNueva = document.createElement('option');
            optNueva.value = "Nueva"; optNueva.innerHTML = "➕ Agregar nueva...";
            select.appendChild(optNueva);
        } catch (e) {
            select.innerHTML = '<option value="Alimentos">Alimentos</option><option value="Nueva">➕ Agregar nueva...</option>';
        }
    }

    function toggleNuevaCat(valor) {
        document.getElementById('customCategory').style.display = (valor === 'Nueva') ? 'block' : 'none';
    }

    async function saveData() {
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        let catFinal = document.getElementById('category').value;
        let esNueva = (catFinal === 'Nueva');
        if(esNueva) catFinal = "🏷️ " + document.getElementById('customCategory').value;

        const payload = {
            fechaCarga: document.getElementById('date').value,
            usuario: document.getElementById('user').value,
            monto: document.getElementById('amount').value,
            categoria: catFinal,
            desc: document.getElementById('desc').value,
            banco: document.getElementById('bank').value,
            tarjeta: document.getElementById('card').value,
            nuevaCategoria: esNueva
        };

        if(!payload.monto || !payload.desc || catFinal === "") return alert("Faltan datos");

        btn.disabled = true; btn.innerText = "Guardando...";
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            status.innerHTML = "<span style='color:var(--success)'>✅ ¡Guardado con éxito!</span>";
            document.getElementById('amount').value = "";
            document.getElementById('desc').value = "";
            if(esNueva) await cargarCategorias();
        } catch (error) {
            status.innerHTML = "<span style='color:#dc2626'>❌ Error</span>";
        } finally {
            btn.disabled = false; btn.innerText = "Guardar Gasto";
        }
    }
</script>
</body>
</html>
