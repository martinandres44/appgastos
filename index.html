<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Familiar</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        .brand-logo svg {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG Logos de tarjetas
        const VisaLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#1A1F71"/>
                <path d="M50.5 48.5L54.8 23.5H61.2L56.9 48.5H50.5Z" fill="#FFFFFF"/>
                <path d="M78.2 24.1C76.8 23.5 74.5 22.8 71.7 22.8C65.4 22.8 60.9 26.1 60.9 30.8C60.8 34.3 64 36.2 66.4 37.4C68.8 38.6 69.7 39.4 69.7 40.5C69.6 42.2 67.6 43 65.7 43C63.1 43 61.7 42.6 59.5 41.6L58.6 41.2L57.6 47.4C59.3 48.1 62.3 48.8 65.4 48.8C72.1 48.8 76.5 45.6 76.6 40.6C76.6 37.8 74.8 35.7 71.2 33.9C69 32.8 67.6 32 67.6 30.8C67.7 29.7 68.9 28.6 71.5 28.6C73.7 28.5 75.3 29.1 76.5 29.7L77.1 30L78.2 24.1Z" fill="#FFFFFF"/>
                <path d="M89.5 23.5C88 23.5 86.8 24 86.1 25.6L76.6 48.5H83.3L84.6 44.8H92.8L93.6 48.5H99.5L94.3 23.5H89.5ZM86.3 39.8C86.8 38.4 89 32.5 89 32.5C89 32.6 89.5 31.1 89.8 30.2L90.2 32.3C90.2 32.3 91.5 38.1 91.8 39.8H86.3Z" fill="#FFFFFF"/>
                <path d="M46.2 23.5L39.9 40.3L39.2 36.8C38 32.8 34.3 28.5 30.2 26.3L35.9 48.4H42.7L53 23.5H46.2Z" fill="#FFFFFF"/>
                <path d="M34.6 23.5H24.3L24.2 24.1C32.2 26.1 37.5 30.8 39.2 36.8L37.4 25.7C37.1 24.1 35.9 23.6 34.6 23.5Z" fill="#F7B600"/>
            </svg>
        );

        const MastercardLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#252525"/>
                <circle cx="47" cy="36" r="22" fill="#EB001B"/>
                <circle cx="73" cy="36" r="22" fill="#F79E1B"/>
                <path d="M60 19.5C54.5 23.8 51 30.5 51 36C51 41.5 54.5 48.2 60 52.5C65.5 48.2 69 41.5 69 36C69 30.5 65.5 23.8 60 19.5Z" fill="#FF5F00"/>
            </svg>
        );

        const AmexLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#006FCF"/>
                <text x="60" y="32" textAnchor="middle" fill="white" fontSize="13" fontWeight="bold" fontFamily="Arial">AMERICAN</text>
                <text x="60" y="48" textAnchor="middle" fill="white" fontSize="13" fontWeight="bold" fontFamily="Arial">EXPRESS</text>
            </svg>
        );

        const EfectivoLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#22C55E"/>
                <text x="60" y="42" textAnchor="middle" fill="white" fontSize="28" fontWeight="bold" fontFamily="Arial">$</text>
            </svg>
        );

        const TransferenciaLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#6366F1"/>
                <path d="M30 30H75L65 22" stroke="white" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
                <path d="M90 42H45L55 50" stroke="white" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
        );

        // SVG Logos de bancos
        const GaliciaLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#FF6B00"/>
                <text x="60" y="30" textAnchor="middle" fill="white" fontSize="11" fontWeight="bold" fontFamily="Arial">BANCO</text>
                <text x="60" y="48" textAnchor="middle" fill="white" fontSize="14" fontWeight="bold" fontFamily="Arial">GALICIA</text>
            </svg>
        );

        const BBVALogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#004481"/>
                <text x="60" y="44" textAnchor="middle" fill="white" fontSize="22" fontWeight="bold" fontFamily="Arial">BBVA</text>
            </svg>
        );

        const ICBCLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#C8102E"/>
                <text x="60" y="44" textAnchor="middle" fill="white" fontSize="22" fontWeight="bold" fontFamily="Arial">ICBC</text>
            </svg>
        );

        const BNALogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#003D7A"/>
                <text x="60" y="30" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold" fontFamily="Arial">BANCO</text>
                <text x="60" y="48" textAnchor="middle" fill="#87CEEB" fontSize="14" fontWeight="bold" fontFamily="Arial">NACIÓN</text>
            </svg>
        );

        const MercadoPagoLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#00B1EA"/>
                <circle cx="42" cy="30" r="12" fill="white" opacity="0.3"/>
                <circle cx="42" cy="30" r="8" fill="white" opacity="0.5"/>
                <text x="66" y="32" textAnchor="start" fill="white" fontSize="10" fontWeight="bold" fontFamily="Arial">Mercado</text>
                <text x="42" y="52" textAnchor="start" fill="white" fontSize="14" fontWeight="bold" fontFamily="Arial">Pago</text>
                <path d="M26 28C26 28 30 20 42 20C54 20 58 28 58 28" stroke="white" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
            </svg>
        );

        const NingunoLogo = ({size = 32}) => (
            <svg width={size} height={size * 0.6} viewBox="0 0 120 72" fill="none">
                <rect width="120" height="72" rx="8" fill="#9CA3AF"/>
                <text x="60" y="42" textAnchor="middle" fill="white" fontSize="14" fontFamily="Arial">—</text>
            </svg>
        );

        // Mapeo de logos
        const CARD_LOGO_COMPONENTS = {
            'Visa': VisaLogo,
            'Mastercard': MastercardLogo,
            'American Express': AmexLogo,
            'Efectivo': EfectivoLogo,
            'Transferencia': TransferenciaLogo
        };

        const BANK_LOGO_COMPONENTS = {
            'Galicia': GaliciaLogo,
            'BBVA': BBVALogo,
            'ICBC': ICBCLogo,
            'BNA': BNALogo,
            'Mercado Pago': MercadoPagoLogo,
            'Ninguno': NingunoLogo
        };

        // Colores para badges (se mantienen para referencia)
        const CARD_COLORS = {
            'Visa': { color: '#1A1F71', bg: '#E8F4FD' },
            'Mastercard': { color: '#EB001B', bg: '#FFF5F5' },
            'American Express': { color: '#006FCF', bg: '#E8F4FD' },
            'Efectivo': { color: '#22C55E', bg: '#F0FDF4' },
            'Transferencia': { color: '#6366F1', bg: '#EEF2FF' }
        };
        
        const BANK_COLORS = {
            'Galicia': { color: '#FF6B00', bg: '#FFF7ED' },
            'BBVA': { color: '#004481', bg: '#EFF6FF' },
            'ICBC': { color: '#C8102E', bg: '#FEF2F2' },
            'BNA': { color: '#003D7A', bg: '#EFF6FF' },
            'Mercado Pago': { color: '#00B1EA', bg: '#F0F9FF' },
            'Ninguno': { color: '#6B7280', bg: '#F9FAFB' }
        };

        function ExpenseTrackerApp() {
            // Estado de usuario actual
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            
            // Estados de datos (ahora compartidos entre todos los usuarios)
            const [transactions, setTransactions] = useState([]);
            const [categories, setCategories] = useState([
                'Alimentos', 'Transporte', 'Servicios', 'Entretenimiento', 
                'Salud', 'Educación', 'Compras', 'Otro'
            ]);
            const [cards, setCards] = useState(['Efectivo', 'Visa', 'Mastercard', 'American Express', 'Transferencia']);
            const [banks, setBanks] = useState(['Ninguno', 'Galicia', 'BBVA', 'ICBC', 'BNA', 'Mercado Pago']);
            const [budgets, setBudgets] = useState({});
            
            // Estado para el formulario de nueva transacción
            const [newTransaction, setNewTransaction] = useState({
                type: 'gasto',
                amount: '',
                description: '',
                category: 'Alimentos',
                card: 'Efectivo',
                bank: 'Ninguno',
                date: new Date().toISOString().split('T')[0]
            });
            
            // Estados para mostrar/ocultar secciones
            const [showAddCard, setShowAddCard] = useState(false);
            const [showAddBank, setShowAddBank] = useState(false);
            const [showAddCategory, setShowAddCategory] = useState(false);
            const [showBudgets, setShowBudgets] = useState(false);
            const [activeTab, setActiveTab] = useState('transactions');
            const [showUserManagement, setShowUserManagement] = useState(false);
            const [filterByUser, setFilterByUser] = useState('todos');
            const [filterByMonth, setFilterByMonth] = useState('todos');
            const [syncStatus, setSyncStatus] = useState('synced');
            
            // Cargar datos al iniciar
            useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 5000);
                return () => clearInterval(interval);
            }, []);
            
            // Guardar datos cuando cambien
            useEffect(() => {
                if (currentUser) {
                    saveData();
                }
            }, [transactions, categories, cards, banks, budgets, users]);
            
            // Función para cargar datos del almacenamiento compartido
            const loadData = async () => {
                try {
                    setSyncStatus('syncing');
                    
                    const savedUsers = await window.storage.get('family-users', true);
                    if (savedUsers) setUsers(JSON.parse(savedUsers.value));
                    
                    const savedTransactions = await window.storage.get('family-transactions', true);
                    if (savedTransactions) setTransactions(JSON.parse(savedTransactions.value));
                    
                    const savedCategories = await window.storage.get('family-categories', true);
                    if (savedCategories) setCategories(JSON.parse(savedCategories.value));
                    
                    const savedCards = await window.storage.get('family-cards', true);
                    if (savedCards) setCards(JSON.parse(savedCards.value));
                    
                    const savedBanks = await window.storage.get('family-banks', true);
                    if (savedBanks) setBanks(JSON.parse(savedBanks.value));
                    
                    const savedBudgets = await window.storage.get('family-budgets', true);
                    if (savedBudgets) setBudgets(JSON.parse(savedBudgets.value));
                    
                    const savedCurrentUser = await window.storage.get('current-user', false);
                    if (savedCurrentUser) setCurrentUser(savedCurrentUser.value);
                    
                    setSyncStatus('synced');
                } catch (error) {
                    console.log('Inicializando datos por primera vez');
                    setSyncStatus('synced');
                }
            };
            
            // Función para guardar datos
            const saveData = async () => {
                try {
                    setSyncStatus('syncing');
                    
                    await window.storage.set('family-users', JSON.stringify(users), true);
                    await window.storage.set('family-transactions', JSON.stringify(transactions), true);
                    await window.storage.set('family-categories', JSON.stringify(categories), true);
                    await window.storage.set('family-cards', JSON.stringify(cards), true);
                    await window.storage.set('family-banks', JSON.stringify(banks), true);
                    await window.storage.set('family-budgets', JSON.stringify(budgets), true);
                    
                    if (currentUser) {
                        await window.storage.set('current-user', currentUser, false);
                    }
                    
                    setSyncStatus('synced');
                } catch (error) {
                    console.error('Error guardando datos:', error);
                    setSyncStatus('error');
                }
            };
            
            // Función para crear nuevo usuario
            const createUser = (userName) => {
                if (!userName || users.find(u => u.name === userName)) {
                    alert('Por favor ingresá un nombre válido y único');
                    return;
                }
                
                const newUser = {
                    id: Date.now().toString(),
                    name: userName,
                    color: `#${Math.floor(Math.random()*16777215).toString(16)}`
                };
                
                setUsers([...users, newUser]);
                setCurrentUser(userName);
            };
            
            // Función para cambiar de usuario
            const switchUser = (userName) => {
                setCurrentUser(userName);
            };
            
            // Agregar nueva transacción
            const addTransaction = () => {
                if (!newTransaction.amount || !newTransaction.description) {
                    alert('Por favor completá todos los campos');
                    return;
                }
                
                if (!currentUser) {
                    alert('Por favor seleccioná un usuario primero');
                    return;
                }
                
                const transaction = {
                    ...newTransaction,
                    amount: parseFloat(newTransaction.amount),
                    id: Date.now(),
                    user: currentUser,
                    createdAt: new Date().toISOString()
                };
                
                setTransactions([transaction, ...transactions]);
                
                setNewTransaction({
                    type: 'gasto',
                    amount: '',
                    description: '',
                    category: categories[0] || 'Alimentos',
                    card: cards[0] || 'Efectivo',
                    bank: banks[0] || 'Ninguno',
                    date: new Date().toISOString().split('T')[0]
                });
            };
            
            // Eliminar transacción
            const deleteTransaction = (id) => {
                if (confirm('¿Estás seguro de eliminar esta transacción?')) {
                    setTransactions(transactions.filter(t => t.id !== id));
                }
            };
            
            // Agregar nueva tarjeta
            const addCard = (cardName) => {
                if (cardName && !cards.includes(cardName)) {
                    setCards([...cards, cardName]);
                }
            };
            
            // Agregar nuevo banco
            const addBank = (bankName) => {
                if (bankName && !banks.includes(bankName)) {
                    setBanks([...banks, bankName]);
                }
            };
            
            // Agregar nueva categoría
            const addCategory = (categoryName) => {
                if (categoryName && !categories.includes(categoryName)) {
                    setCategories([...categories, categoryName]);
                }
            };
            
            // Establecer presupuesto
            const setBudget = (category, amount) => {
                setBudgets({
                    ...budgets,
                    [category]: parseFloat(amount) || 0
                });
            };
            
            // Obtener lista de meses disponibles
            const getAvailableMonths = () => {
                const months = new Set();
                transactions.forEach(t => {
                    const date = new Date(t.date);
                    const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    months.add(monthKey);
                });
                return Array.from(months).sort().reverse();
            };
            
            // Formatear mes para mostrar
            const formatMonth = (monthKey) => {
                const [year, month] = monthKey.split('-');
                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                                   'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                return `${monthNames[parseInt(month) - 1]} ${year}`;
            };
            
            // Filtrar transacciones
            const getFilteredTransactions = () => {
                let filtered = transactions;
                
                // Filtrar por usuario
                if (filterByUser !== 'todos') {
                    filtered = filtered.filter(t => t.user === filterByUser);
                }
                
                // Filtrar por mes
                if (filterByMonth !== 'todos') {
                    filtered = filtered.filter(t => {
                        const date = new Date(t.date);
                        const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        return monthKey === filterByMonth;
                    });
                }
                
                return filtered;
            };
            
            // Calcular totales
            const calculateTotals = () => {
                const filtered = getFilteredTransactions();
                
                const totalIngresos = filtered
                    .filter(t => t.type === 'ingreso')
                    .reduce((sum, t) => sum + t.amount, 0);
                
                const totalGastos = filtered
                    .filter(t => t.type === 'gasto')
                    .reduce((sum, t) => sum + t.amount, 0);
                
                return {
                    ingresos: totalIngresos,
                    gastos: totalGastos,
                    balance: totalIngresos - totalGastos
                };
            };
            
            // Calcular gastos por categoría
            const calculateByCategory = () => {
                const filtered = getFilteredTransactions();
                const byCategory = {};
                filtered
                    .filter(t => t.type === 'gasto')
                    .forEach(t => {
                        byCategory[t.category] = (byCategory[t.category] || 0) + t.amount;
                    });
                return byCategory;
            };
            
            // Calcular gastos por tarjeta
            const calculateByCard = () => {
                const filtered = getFilteredTransactions();
                const byCard = {};
                filtered
                    .filter(t => t.type === 'gasto')
                    .forEach(t => {
                        byCard[t.card] = (byCard[t.card] || 0) + t.amount;
                    });
                return byCard;
            };
            
            // Calcular gastos por usuario
            const calculateByUser = () => {
                const byUser = {};
                transactions
                    .filter(t => t.type === 'gasto')
                    .forEach(t => {
                        byUser[t.user] = (byUser[t.user] || 0) + t.amount;
                    });
                return byUser;
            };
            
            // Componente de Logo
            const Logo = ({ type, name, small = false }) => {
                const components = type === 'card' ? CARD_LOGO_COMPONENTS : BANK_LOGO_COMPONENTS;
                const colors = type === 'card' ? CARD_COLORS : BANK_COLORS;
                const LogoComponent = components[name];
                const colorInfo = colors[name] || { color: '#6B7280', bg: '#F9FAFB' };
                const logoSize = small ? 24 : 36;
                
                return (
                    <div 
                        className={`inline-flex items-center gap-1.5 px-2 py-1 rounded-lg brand-logo ${small ? 'text-xs' : 'text-sm'}`}
                        style={{ backgroundColor: colorInfo.bg }}
                    >
                        {LogoComponent ? (
                            <LogoComponent size={logoSize} />
                        ) : (
                            <span className={small ? 'text-base' : 'text-lg'}>💳</span>
                        )}
                        <span className="font-semibold" style={{ color: colorInfo.color }}>{name}</span>
                    </div>
                );
            };
            
            // Exportar a Excel
            const exportToExcel = () => {
                const filtered = getFilteredTransactions();
                const excelData = filtered.map(t => ({
                    'Fecha': t.date,
                    'Usuario': t.user,
                    'Tipo': t.type.toUpperCase(),
                    'Descripción': t.description,
                    'Categoría': t.category,
                    'Tarjeta': t.card,
                    'Banco': t.bank,
                    'Monto': t.amount
                }));
                
                const wb = XLSX.utils.book_new();
                
                const ws1 = XLSX.utils.json_to_sheet(excelData);
                XLSX.utils.book_append_sheet(wb, ws1, "Transacciones");
                
                const byCategory = calculateByCategory();
                const categoryData = Object.entries(byCategory).map(([cat, amount]) => ({
                    'Categoría': cat,
                    'Total Gastado': amount,
                    'Presupuesto': budgets[cat] || 0,
                    'Diferencia': (budgets[cat] || 0) - amount
                }));
                const ws2 = XLSX.utils.json_to_sheet(categoryData);
                XLSX.utils.book_append_sheet(wb, ws2, "Por Categoría");
                
                const byUser = calculateByUser();
                const userData = Object.entries(byUser).map(([user, amount]) => ({
                    'Usuario': user,
                    'Total Gastado': amount
                }));
                const ws3 = XLSX.utils.json_to_sheet(userData);
                XLSX.utils.book_append_sheet(wb, ws3, "Por Usuario");
                
                const totals = calculateTotals();
                const summaryData = [
                    {'Concepto': 'Total Ingresos', 'Monto': totals.ingresos},
                    {'Concepto': 'Total Gastos', 'Monto': totals.gastos},
                    {'Concepto': 'Balance', 'Monto': totals.balance}
                ];
                const ws4 = XLSX.utils.json_to_sheet(summaryData);
                XLSX.utils.book_append_sheet(wb, ws4, "Resumen");
                
                const monthFilter = filterByMonth !== 'todos' ? `_${filterByMonth}` : '';
                const userFilter = filterByUser !== 'todos' ? `_${filterByUser}` : '';
                const fileName = `gastos_familiares${monthFilter}${userFilter}_${new Date().toISOString().split('T')[0]}.xlsx`;
                XLSX.writeFile(wb, fileName);
            };
            
            const totals = calculateTotals();
            const byCategory = calculateByCategory();
            const byCard = calculateByCard();
            const byUser = calculateByUser();
            const filteredTransactions = getFilteredTransactions();
            const availableMonths = getAvailableMonths();
            
            // Pantalla de inicio de sesión
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">👨‍👩‍👧‍👦 Control de Gastos</h1>
                                <p className="text-gray-600">Familiar y Compartido</p>
                            </div>
                            
                            {users.length > 0 && (
                                <div className="mb-6">
                                    <h2 className="text-lg font-semibold mb-3">Seleccioná tu usuario:</h2>
                                    <div className="space-y-2">
                                        {users.map(user => (
                                            <button
                                                key={user.id}
                                                onClick={() => switchUser(user.name)}
                                                className="w-full p-4 border-2 rounded-lg hover:bg-blue-50 hover:border-blue-500 transition flex items-center gap-3"
                                            >
                                                <div 
                                                    className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold"
                                                    style={{backgroundColor: user.color}}
                                                >
                                                    {user.name.charAt(0).toUpperCase()}
                                                </div>
                                                <span className="font-semibold">{user.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            <div className="border-t pt-6">
                                <h2 className="text-lg font-semibold mb-3">Crear nuevo usuario:</h2>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        id="newUserName"
                                        className="flex-1 px-4 py-2 border rounded-lg"
                                        placeholder="Tu nombre"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                createUser(e.target.value);
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => {
                                            const input = document.getElementById('newUserName');
                                            createUser(input.value);
                                            input.value = '';

                                                <button
                                                    onClick={() => setShowBudgets(!showBudgets)}
                                                    className="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
                                                >
                                                    {showBudgets ? 'Ocultar' : 'Configurar'}
                                                </button>
                                            </div>
                                            {showBudgets && (
                                                <div className="space-y-3">
                                                    {categories.map(category => (
                                                        <div key={category} className="flex flex-col md:flex-row md:items-center gap-2 md:gap-3">
                                                            <label className="md:w-1/3 font-semibold">{category}</label>
                                                            <input
                                                                type="number"
                                                                step="0.01"
                                                                value={budgets[category] || ''}
                                                                onChange={(e) => setBudget(category, e.target.value)}
                                                                className="flex-1 px-4 py-2 border rounded-lg"
                                                                placeholder="0.00"
                                                            />
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        {/* Footer */}
                        <div className="text-center text-gray-600 text-sm mt-8 space-y-2">
                            <p>☁️ Todos los datos se sincronizan automáticamente en la nube</p>
                            <p>👨‍👩‍👧‍👦 Todos los miembros de la familia ven los mismos datos en tiempo real</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ExpenseTrackerApp />, document.getElementById('root'));
    </script>
</body>
</html>
